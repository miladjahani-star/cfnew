name: Auto Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - '明文源吗'
      - 'wrangler.toml'
      - '.github/workflows/auto-deploy.yml'
  workflow_dispatch:
    inputs:
      debug_mode:
        description: 'Enable debug logging'
        required: false
        default: 'false'
        type: boolean

jobs:
  deploy:
    name: Deploy Worker + Setup KV
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for OIDC authentication with Cloudflare

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Authenticate with Cloudflare (OIDC)
        run: |
          echo "=== Cloudflare Authentication via OIDC ==="
          echo "Using GitHub OIDC for passwordless authentication..."
          echo ""
          echo "Configuration details:"
          echo "- Organization: $GITHUB_REPOSITORY_OWNER"
          echo "- Repository: ${{ github.repository }}"
          echo "- Branch: main"
          echo ""
          
          # Verify wrangler can authenticate
          if ! wrangler whoami > /dev/null 2>&1; then
            echo "❌ OIDC authentication failed!"
            echo ""
            echo "Please ensure you have configured Cloudflare API Token with OIDC trust:"
            echo "1. Go to https://dash.cloudflare.com/profile/api-tokens"
            echo "2. Create API Token with 'Edit Cloudflare Workers' template"
            echo "3. Under 'Advanced', add GitHub OIDC trust:"
            echo "   - Organization: $GITHUB_REPOSITORY_OWNER"
            echo "   - Repository: ${{ github.repository }}"
            echo "   - Branch: main"
            echo "4. Save the token"
            exit 1
          fi
          
          echo "✅ Successfully authenticated with Cloudflare"
          wrangler whoami

      - name: Setup KV Namespace (idempotent)
        id: kv-setup
        run: |
          echo "=== KV Namespace Setup ==="
          echo "Checking current configuration..."

          # Check if wrangler.toml already has a real KV ID
          KV_ID=$(grep -A2 'binding = "C"' wrangler.toml | grep 'id = ' | head -1 | sed 's/.*id = "\([^"]*\)".*/\1/')

          if [ "$KV_ID" != "AUTO_SETUP_KV" ] && [ -n "$KV_ID" ]; then
            echo "✅ KV namespace already configured: $KV_ID"
            echo "kv_id=$KV_ID" >> $GITHUB_OUTPUT
          else
            echo "Creating new KV namespace named 'C'..."

            # Create namespace - capture create output
            CREATE_OUTPUT=$(wrangler kv namespace create "C" 2>&1)
            echo "$CREATE_OUTPUT"

            # Extract ID from create output (wrangler prints: "with id \"xxx\"")
            NEW_ID=$(echo "$CREATE_OUTPUT" | grep -oP 'with id "\K[^"]+' | head -1)

            if [ -z "$NEW_ID" ]; then
              echo "❌ Failed to create KV namespace"
              echo "Full output: $CREATE_OUTPUT"
              exit 1
            fi

            echo "✅ Created KV namespace: $NEW_ID"
            echo "kv_id=$NEW_ID" >> $GITHUB_OUTPUT

            # Update wrangler.toml with real ID
            sed -i "s/AUTO_SETUP_KV/$NEW_ID/g" wrangler.toml
            echo "Updated wrangler.toml with real KV namespace ID"
          fi

      - name: Deploy to Cloudflare Workers
        run: |
          echo "=== Deploying Worker ==="
          wrangler deploy

          echo ""
          echo "=== Deployment Summary ==="
          WORKER_NAME=$(grep '^name' wrangler.toml | cut -d'"' -f2)
          KV_ID=${{ steps.kv-setup.outputs.kv_id }}

          echo "Worker Name: $WORKER_NAME"
          echo "KV Namespace ID: $KV_ID"
          echo ""
          echo "✅ Worker deployed successfully!"
          echo "URL: https://$WORKER_NAME.workers.dev"
          echo "Admin Panel: visit /{YOUR_UUID} to configure"

      - name: Commit KV config update (if created)
        run: |
          if git diff --quiet wrangler.toml; then
            echo "No changes needed to wrangler.toml"
          else
            echo "Auto-configuring KV namespace ID..."
            git config --global user.name 'GitHub Actions Bot'
            git config --global user.email 'github-actions[bot]@users.noreply.github.com'
            git add wrangler.toml
            git commit -m "chore: auto-configure KV namespace ID [skip ci]"
            git push
            echo "Committed KV configuration"
          fi

      - name: Summary
        run: |
          WORKER_NAME=$(grep '^name' wrangler.toml | cut -d'"' -f2)
          KV_ID=${{ steps.kv-setup.outputs.kv_id || 'not created' }}
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Setting | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Worker | $WORKER_NAME |" >> $GITHUB_STEP_SUMMARY
          echo "| KV Binding | C |" >> $GITHUB_STEP_SUMMARY
          echo "| KV Namespace ID | $KV_ID |" >> $GITHUB_STEP_SUMMARY
          echo "| URL | https://$WORKER_NAME.workers.dev |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Deployment completed successfully" >> $GITHUB_STEP_SUMMARY
