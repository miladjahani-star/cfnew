name: Auto Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - '明文源吗'
      - 'wrangler.toml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Worker + Setup KV
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Validate Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "❌ Missing Cloudflare credentials!"
            echo "Please add these secrets to your repository:"
            echo "  - CLOUDFLARE_API_TOKEN"
            echo "  - CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          echo "✅ Cloudflare credentials found"
          wrangler whoami

      - name: Setup KV Namespace (idempotent)
        id: kv-setup
        run: |
          echo "Checking KV namespace configuration..."
          
          # Check if wrangler.toml already has a real KV ID
          CURRENT_ID=$(grep -A2 'binding = "C"' wrangler.toml | grep 'id = ' | head -1 | sed 's/.*id = "\(.*\)"/\1/')
          
          if [ "$CURRENT_ID" != "AUTO_SETUP_KV" ] && [ -n "$CURRENT_ID" ]; then
            echo "✅ KV namespace already configured: $CURRENT_ID"
            echo "kv_id=$CURRENT_ID" >> $GITHUB_OUTPUT
          else
            echo "Creating new KV namespace 'C'..."
            
            # Create the namespace and capture output
            OUTPUT=$(wrangler kv namespace create "C" 2>&1)
            echo "$OUTPUT"
            
            # Extract the ID from output (format: ... with id "xxx" ...)
            NEW_ID=$(echo "$OUTPUT" | grep -oP 'with id "\K[^"]+' | head -1)
            
            if [ -z "$NEW_ID" ]; then
              echo "❌ Failed to create KV namespace"
              echo "Output was: $OUTPUT"
              exit 1
            fi
            
            echo "✅ Created KV namespace: $NEW_ID"
            echo "kv_id=$NEW_ID" >> $GITHUB_OUTPUT
            
            # Update wrangler.toml with real ID
            sed -i "s/AUTO_SETUP_KV/$NEW_ID/g" wrangler.toml
            echo "Updated wrangler.toml with real KV namespace ID"
          fi

      - name: Deploy to Cloudflare Workers
        run: |
          echo "Deploying CFnew Worker..."
          wrangler deploy
          
          echo ""
          echo "=== Deployment Complete ==="
          
          # Get the worker URL
          WORKER_NAME=$(grep '^name' wrangler.toml | cut -d'"' -f2)
          ACCOUNT_ID_LEN=${#CLOUDFLARE_ACCOUNT_ID}
          echo "Worker: $WORKER_NAME"
          echo "Account ID: ${CLOUDFLARE_ACCOUNT_ID:0:8}..."
          echo ""
          echo "Worker URL: https://$WORKER_NAME.${CLOUDFLARE_ACCOUNT_ID}.workers.dev"
          echo "Admin Panel: Visit /{YOUR_UUID} after deployment"

      - name: Commit KV config update (if created)
        run: |
          if git diff --quiet wrangler.toml; then
            echo "No changes to wrangler.toml"
          else
            echo "KV namespace ID was auto-configured, committing..."
            git config --global user.name 'GitHub Actions Bot'
            git config --global user.email 'github-actions[bot]@users.noreply.github.com'
            git add wrangler.toml
            git commit -m "chore: auto-configure KV namespace ID [skip ci]"
            git push
          fi

      - name: Output deployment summary
        run: |
          WORKER_NAME=$(grep '^name' wrangler.toml | cut -d'"' -f2)
          KV_ID=$(grep -A2 'binding = "C"' wrangler.toml | grep 'id = ' | head -1 | sed 's/.*id = "\(.*\)"/\1/')
          
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Worker Configuration" >> $GITHUB_STEP_SUMMARY
          echo "- **Name:** $WORKER_NAME" >> $GITHUB_STEP_SUMMARY
          echo "- **Source:** 明文源吗" >> $GITHUB_STEP_SUMMARY
          echo "- **Compatibility Date:** 2026-01-20" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### KV Storage" >> $GITHUB_STEP_SUMMARY
          echo "- **Binding:** C" >> $GITHUB_STEP_SUMMARY
          echo "- **Namespace ID:** $KV_ID" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Access" >> $GITHUB_STEP_SUMMARY
          echo "- **Worker URL:** https://$WORKER_NAME.${CLOUDFLARE_ACCOUNT_ID}.workers.dev" >> $GITHUB_STEP_SUMMARY
          echo "- **Admin Panel:** Visit \`/{YOUR_UUID}\` after deployment" >> $GITHUB_STEP_SUMMARY
