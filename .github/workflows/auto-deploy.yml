name: Auto Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - '明文源吗'
      - 'wrangler.toml'
  workflow_dispatch:

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    name: Deploy Worker + Setup KV
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Validate Cloudflare credentials
        run: |
          echo "Verifying Cloudflare API access..."
          wrangler whoami
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Setup KV Namespace (idempotent)
        id: kv-setup
        run: |
          echo "Checking if KV namespace 'C' exists..."
          
          # Get existing KV namespaces
          EXISTING=$(wrangler kv namespace list --format=json 2>/dev/null || echo "[]")
          
          # Check if we already have a namespace named "C" (binding name)
          # We look for the one we need - if wrangler.toml already has a valid ID, skip
          CURRENT_ID=$(grep -A2 'binding = "C"' wrangler.toml | grep 'id = ' | head -1 | sed 's/.*id = "\(.*\)"/\1/')
          
          if [ "$CURRENT_ID" != "AUTO_SETUP_KV" ] && [ -n "$CURRENT_ID" ]; then
            echo "KV namespace already configured: $CURRENT_ID"
            echo "kv_id=$CURRENT_ID" >> $GITHUB_OUTPUT
          else
            echo "Creating new KV namespace 'C'..."
            NEW_ID=$(wrangler kv namespace create "C" --format=json | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
            
            if [ -z "$NEW_ID" ]; then
              echo "Error: Failed to create KV namespace"
              exit 1
            fi
            
            echo "Created KV namespace: $NEW_ID"
            echo "kv_id=$NEW_ID" >> $GITHUB_OUTPUT
            
            # Update wrangler.toml with real ID
            sed -i "s/AUTO_SETUP_KV/$NEW_ID/g" wrangler.toml
            echo "Updated wrangler.toml with real KV namespace ID"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Update wrangler.toml if needed
        run: |
          # If KV was just created, the ID was updated in-place above
          # If it already existed, no change needed
          KV_ID=${{ steps.kv-setup.outputs.kv_id }}
          
          if [ -n "$KV_ID" ]; then
            # Double-check the config is correct
            echo "Final KV namespace ID: $KV_ID"
            grep -A3 'binding = "C"' wrangler.toml
          fi

      - name: Deploy to Cloudflare Workers
        run: |
          echo "Deploying CFnew Worker..."
          wrangler deploy
          
          echo ""
          echo "=== Deployment Complete ==="
          echo "Worker URL: https://cfnew.${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.workers.dev"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Commit KV config update (if created)
        run: |
          # Only commit if wrangler.toml was modified with a new KV ID
          if git diff --quiet wrangler.toml; then
            echo "No changes to wrangler.toml"
          else
            echo "KV namespace ID was auto-configured, committing..."
            git config --global user.name 'GitHub Actions Bot'
            git config --global user.email 'github-actions[bot]@users.noreply.github.com'
            git add wrangler.toml
            git commit -m "chore: auto-configure KV namespace ID [skip ci]"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Output deployment summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Worker Configuration" >> $GITHUB_STEP_SUMMARY
          echo "- **Name:** cfnew" >> $GITHUB_STEP_SUMMARY
          echo "- **Source:** 明文源吗" >> $GITHUB_STEP_SUMMARY
          echo "- **Compatibility Date:** 2026-01-20" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### KV Storage" >> $GITHUB_STEP_SUMMARY
          echo "- **Binding:** C" >> $GITHUB_STEP_SUMMARY
          echo "- **Purpose:** Config + User Management" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Access" >> $GITHUB_STEP_SUMMARY
          echo "- **Worker URL:** https://cfnew.\${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.workers.dev" >> $GITHUB_STEP_SUMMARY
          echo "- **Admin Panel:** Visit \`/{YOUR_UUID}\` after deployment" >> $GITHUB_STEP_SUMMARY
